name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x64", runner: ubuntu-latest, py_arch: x64 }
          - { name: "Windows x64", runner: windows-latest, py_arch: x64 }
          - { name: "Windows ARM64", runner: windows-11-arm, py_arch: arm64 }
          - { name: "macOS Apple Silicon", runner: macos-latest, py_arch: arm64 }
          - { name: "macOS Intel", runner: macos-15-intel, py_arch: x64 }
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.py_arch }}

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Show interpreter architecture
        run: python -c "import platform, struct; print(platform.system(), platform.machine(), struct.calcsize('P')*8, 'bit')"

      - name: Run tests (scanner, sizes, treemap, categories, CSV/JSON export, localization, permissions)
        run: python -m pytest -ra --color=yes

      - name: Headless smoke test (from source)
        run: python main.py --smoke-test
