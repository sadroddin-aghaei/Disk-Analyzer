name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate project structure
        run: python scripts/validate_structure.py

      - name: Lint (ruff)
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Type check (mypy)
        run: mypy .

      - name: Check application imports
        run: |
          python - <<'PY'
          import importlib
          for m in ("app", "app.scanner", "app.treemap", "app.drive_manager", "app.file_categories",
                    "app.localization", "app.settings", "app.export_manager", "app.workers",
                    "app.main_window", "app.widgets.treemap_widget", "app.smoke"):
              importlib.import_module(m)
              print("import ok:", m)
          PY

      - name: Unit tests
        run: python -m pytest -ra --color=yes

      - name: Headless smoke test (from source)
        run: python main.py --smoke-test
