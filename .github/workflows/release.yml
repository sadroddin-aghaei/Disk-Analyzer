name: Release

# Push a SemVer tag to publish:   git tag v1.0.0 && git push origin v1.0.0
# or run this workflow manually and enter a version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release (e.g. 1.0.0 or 1.1.0-rc.1)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect and validate Semantic Version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          raw="$REF_NAME"
          if [ "$EVENT" = "workflow_dispatch" ]; then raw="$INPUT_VERSION"; fi
          if ! version=$(python3 -c "import sys; sys.path.insert(0,'scripts'); from common import normalize_version as n; print(n(sys.argv[1]))" "$raw" 2>/dev/null); then
            echo "::error::'$raw' is not a valid Semantic Version (expected v1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::a GitHub Release for $tag already exists"; exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "tag=$tag"               >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (prerelease=$prerelease)"

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64,   label: "Windows x64",         runner: windows-latest,  os: windows, arch: x64,   py_arch: x64 }
          - { target: windows-arm64, label: "Windows ARM64",       runner: windows-11-arm,   os: windows, arch: arm64, py_arch: arm64 }
          - { target: macos-arm64,   label: "macOS Apple Silicon", runner: macos-latest,     os: macos,   arch: arm64, py_arch: arm64 }
          - { target: macos-intel,   label: "macOS Intel",         runner: macos-15-intel,   os: macos,   arch: x64,   py_arch: x64 }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.py_arch }}

      - name: Verify the runner really is ${{ matrix.arch }}
        run: python scripts/verify_artifacts.py runner --expect ${{ matrix.arch }}

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Stamp version
        run: python scripts/set_version.py "$VERSION"
        shell: bash

      - name: Run tests
        run: python -m pytest -ra --color=yes

      - name: Build (Windows ZIP)
        if: matrix.os == 'windows'
        run: python scripts/build_windows.py --version "$VERSION" --arch ${{ matrix.arch }}
        shell: bash

      - name: Build (macOS app + DMG)
        if: matrix.os == 'macos'
        run: python scripts/build_macos.py --version "$VERSION" --arch ${{ matrix.arch }}

      - name: Resolve artifact name
        id: art
        shell: bash
        run: echo "name=$(python scripts/artifact_name.py "$VERSION" ${{ matrix.target }})" >> "$GITHUB_OUTPUT"

      - name: Verify architecture, contents and start-up (Windows)
        if: matrix.os == 'windows'
        run: python scripts/verify_artifacts.py windows --zip "release/${{ steps.art.outputs.name }}" --arch ${{ matrix.arch }} --version "$VERSION"
        shell: bash

      - name: Verify architecture, contents and start-up (macOS)
        if: matrix.os == 'macos'
        run: python scripts/verify_artifacts.py macos --dmg "release/${{ steps.art.outputs.name }}" --arch ${{ matrix.arch }} --version "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: release/${{ steps.art.outputs.name }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and attach assets; nothing else
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true

      - name: Confirm all four packages exist
        run: python3 scripts/verify_artifacts.py final --dir artifacts --version "$VERSION"

      - name: Generate and verify SHA256 checksums
        run: |
          python3 scripts/verify_artifacts.py checksums --dir artifacts --version "$VERSION"
          python3 scripts/verify_artifacts.py verify-checksums --dir artifacts --version "$VERSION"
          cat "artifacts/Disk-Analyzer-v${VERSION}-SHA256SUMS.txt"
          (cd artifacts && sha256sum -c "Disk-Analyzer-v${VERSION}-SHA256SUMS.txt")

      - name: Release notes
        run: python3 scripts/release_notes.py "$VERSION" "$TAG" > release-notes.md

      - name: Create GitHub Release
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" artifacts/* \
            --title "Disk Analyzer $TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            --target "$GITHUB_SHA" \
            "${flags[@]}"
